name: Keep Render API awake

on:
  schedule:
    # Toutes les 10 min — le free tier Render s'endort après 15 min d'inactivité
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        # Render free tier peut mettre 50-60s à se réveiller (cold start) :
        # max-time large + retry pour ne pas faire échouer le job sur le premier ping.
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 https://portfollio-cursor.onrender.com/api/health
