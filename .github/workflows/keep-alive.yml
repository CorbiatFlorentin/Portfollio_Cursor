name: Keep Render API awake

on:
  schedule:
    # Toutes les 10 min — le free tier Render s'endort après 15 min d'inactivité
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 30 https://portfollio-cursor.onrender.com/api/health
